[package]
name = "client-pam"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
shared = { workspace = true }

# Protocol buffers
prost.workspace = true
bytes.workspace = true

# Polling and fcntl (single-threaded)
nix = { workspace = true, features = ["poll", "fs", "user"] }

# Configuration
serde = { workspace = true }
toml = { workspace = true }

# Utilities
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-journald.workspace = true
getrandom.workspace = true
hex.workspace = true
libc.workspace = true

# Localization
fluent.workspace = true
unic-langid.workspace = true

[build-dependencies]
# `prettyplease` is disabled on purpose: bindgen 0.73 allows `syn >=2, <4` and
# resolves to `syn` 3 when any proc-macro in the graph needs it, but the only
# `prettyplease` version `prost-build` lets us use (^0.2) still depends on
# `syn` 2. Mixing the two makes bindgen 0.73 fail to compile with
# `syn::file::File: ParseQuote is not satisfied`. We do not need prettyplease
# formatting for generated bindings, so drop it (see the `formatter` call in
# build.rs). Re-enable once prost-build permits `prettyplease` 0.3+.
bindgen = { version = "0.73", default-features = false, features = ["logging", "runtime"] }

[features]
default = []
tpm = ["shared/tpm"]
# dev-socket-override: enable TAPAUTHD_SOCK env var to override the default
# IPC socket path.  This is for development/testing only — production builds
# must NOT enable this feature, as it would allow environment-controlled
# socket redirection which could bypass authentication.
dev-socket-override = []

# replace-fprintd-pam: build the optional "fprintd emulation" variant of this
# module, intended to be installed as `pam_fprintd.so`.  PAM stacks that
# hardcode the vendor fingerprint module (e.g. `gdm-fingerprint`,
# `gdm3-fingerprint`, `kde-fingerprint`, `budgie-fingerprint`, Fedora's
# `fingerprint-auth`, and `pam_fprintd.so` lines inside `system-auth` /
# `common-auth`) then route to TapAuth without a real fprintd.  Fingerprint
# service names are never bypassed and are forced onto the TTY-less sequential
# path with the full `pam_operation_timeout_secs`, so the greeter/locker can
# wait for the phone.  This is opt-in: the default build is unchanged.
# Deliberately independent of `tpm` and `dev-socket-override`.
replace-fprintd-pam = []
