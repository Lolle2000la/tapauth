syntax = "proto3";

package tapauth.protocol;

// ============================================================================
// Cryptographic Algorithm Enumerations
// ============================================================================

// Symmetric AEAD algorithms used to encrypt EncryptedPacket and pairing payloads.
// All defined algorithms use a 32-byte key, a 12-byte random nonce prepended to
// the ciphertext, and a 16-byte authentication tag.
enum SymmetricAlgorithm {
  SYMMETRIC_ALGORITHM_UNSPECIFIED = 0;
  AES_256_GCM = 1;
  CHACHA20_POLY1305 = 2;
}

// Hash algorithms used for HMAC-based temporal identifier derivation.
enum HashAlgorithm {
  HASH_ALGORITHM_UNSPECIFIED = 0;
  SHA256 = 1;
  BLAKE3 = 2;
}

// Digital signature algorithms used for WrapperMessage and pairing identity proofs.
enum SignatureAlgorithm {
  SIGNATURE_ALGORITHM_UNSPECIFIED = 0;
  ED25519 = 1;
}

// Identifies the serialized inner protobuf message carried in WrapperMessage.payload.
enum PayloadType {
  PAYLOAD_TYPE_UNSPECIFIED = 0;
  PAYLOAD_TYPE_AUTH_REQUEST = 1;
  PAYLOAD_TYPE_AUTH_GRANT = 2;
  PAYLOAD_TYPE_AUTH_DENIAL = 3;
  PAYLOAD_TYPE_GRANT_CONFIRMATION = 4;
  PAYLOAD_TYPE_AUTH_CANCEL = 5;
}

// ============================================================================
// Post-Pairing Authentication Messages (Inner Payloads of WrapperMessage)
// ============================================================================

// Sent by the Client (Linux desktop) to request biometric approval on a paired Server (Android).
message AuthenticationRequest {
  // 32-byte cryptographically random challenge nonce uniquely identifying this session.
  bytes challenge = 1;
  // Target Linux account username being authenticated (e.g., "luca", "root").
  string username = 2;
  // Client machine hostname (e.g., "thinkpad").
  string hostname = 3;
  // Current UTC timestamp in Unix seconds (checked against +-60s replay window).
  uint64 timestamp_unix_seconds = 4;

  // Optional signed contextual metadata for display on the Server prompt.
  // Older Clients (or minimal configurations) may leave fields 5-8 default/empty;
  // newer Servers render them as informational context when present.
  // Maximum enforced byte lengths: pam_service <= 32B, process_name <= 32B, command_preview <= 128B.
  string pam_service = 5;
  string process_name = 6;
  string command_preview = 7;
  bool tty_present = 8;
}

// Sent by the Server (Android) when the user approves the authentication request.
// Bound to the session via the raw 32-byte challenge and signed once by WrapperMessage.signature.
message AuthenticationGrant {
  bytes challenge = 1;
}

// Sent by the Server (Android) when the user explicitly denies the authentication request.
message AuthenticationDenial {
  bytes challenge = 1;
  string reason = 2;
}

// Sent by the Client (Linux) to acknowledge receipt of a valid Grant or Denial
// and stop Server retransmissions.
message GrantConfirmation {
  bytes challenge = 1;
}

// Sent by the Client (Linux) to cancel an in-flight authentication session across all transports
// (e.g., PAM conversation completed via password, user pressed Enter, or another transport won).
message AuthenticationCancel {
  bytes challenge = 1;
}

// ============================================================================
// Signed Inner Envelope & Outer Encrypted Wire Packet
// ============================================================================

// Canonical signed envelope decrypted from EncryptedPacket.ciphertext.
//
// CRITICAL EVOLVABILITY INVARIANT:
// `payload` stores the raw protobuf-serialized bytes of the inner message
// identified by `payload_type`. The sender signs and the receiver verifies:
//   "tapauth-sig-v2" || be32(version) || be32(signature_algorithm) || be32(payload_type) || payload
// BEFORE decoding `payload` into the inner protobuf struct. Because verification
// operates on the exact wire bytes of `payload` without re-serializing a decoded
// struct, unknown fields added by future protocol versions are preserved intact
// during signature verification and safely ignored during inner decode.
message WrapperMessage {
  uint32 version = 1;
  SignatureAlgorithm signature_algorithm = 2;
  PayloadType payload_type = 3;
  bytes payload = 4;
  bytes signature = 5;
}

// Outer wire packet transmitted over UDP multicast/unicast and BLE GATT characteristics.
//
// AEAD ASSOCIATED DATA (AAD) INVARIANT:
// `ciphertext` contains `nonce (12 bytes) || AEAD_Encrypt(CSK, nonce, plaintext = serialize(WrapperMessage), aad)`
// where `aad` is:
//   "tapauth-pkt-v2" || be32(encryption_algorithm) || be16(temporal_identifier.len()) || temporal_identifier
message EncryptedPacket {
  // 16-byte rotating HMAC identifier (UDP and BLE GATT characteristics).
  bytes temporal_identifier = 1;
  // Symmetric AEAD algorithm used to encrypt `ciphertext`.
  SymmetricAlgorithm encryption_algorithm = 2;
  // 12-byte random nonce prepended to the AEAD ciphertext + 16-byte tag.
  bytes ciphertext = 3;
}

// ============================================================================
// Unified UDP & BLE Pairing Protocol Messages (v2)
// ============================================================================

// Envelope for all pairing messages sent over a UDP pairing socket or the
// BLE GATT Pairing Characteristic (`PAIRING_CHAR_UUID`).
message PairingPacket {
  uint32 version = 1;
  bytes session_id = 2; // 16-byte random session ID from the QR code (`sid`).

  oneof msg {
    PairingInit init = 3;
    PairingResponse response = 4;
    PairingConfirmClient confirm_client = 5;
    PairingConfirmServer confirm_server = 6;
    PairingAbort abort = 7;
    PairingKeepalive keepalive = 8;
  }
}

// Step 1 (Server/Phone -> Client/Desktop): Initiates the pairing handshake after scanning QR code.
message PairingInit {
  bytes server_x25519_public_key = 1;                        // 32-byte ephemeral X25519 public key (X_S)
  bytes server_ed25519_public_key = 2;                       // 32-byte static Ed25519 public key (Ed_S)
  string server_device_name = 3;                             // Display name (max 64 UTF-8 bytes)
  repeated SymmetricAlgorithm supported_symmetric_algorithms = 4;
  repeated HashAlgorithm supported_hash_algorithms = 5;
  repeated SignatureAlgorithm supported_signature_algorithms = 6;
}

// Step 2 (Client/Desktop -> Server/Phone): Completes key exchange, selects algorithms, and proves Ed_C possession.
message PairingResponse {
  bytes client_x25519_public_key = 1;                        // 32-byte ephemeral X25519 public key (X_C; MUST match QR `pk`)
  bytes client_ed25519_public_key = 2;                       // 32-byte static Ed25519 public key (Ed_C)
  string client_device_name = 3;                             // Client hostname/display name (max 64 UTF-8 bytes)
  SymmetricAlgorithm selected_symmetric_algorithm = 4;
  HashAlgorithm selected_hash_algorithm = 5;
  SignatureAlgorithm selected_signature_algorithm = 6;
  // Ed25519 signature by Ed_C over ("tapauth-pair-client-sig-v2" || H), where H is the
  // canonical SHA-256 handshake transcript hash. Verified by the Server before showing SAS.
  bytes client_signature = 7;
}

// Inner plaintext structure encrypted inside PairingConfirmClient.encrypted_payload.
message PairingProvisionPayload {
  bytes csk = 1;                                             // 32-byte Client Symmetric Key
  string username = 2;                                       // Target Linux username authorized for this pairing
  string client_hostname = 3;                                // Authenticated Client hostname
}

// Step 3 (Client/Desktop -> Server/Phone): Sent after the user confirms the 6-digit SAS on the Desktop.
message PairingConfirmClient {
  // 12-byte random nonce || AEAD(key = K_c2s, nonce, aad = "tapauth-pair-v2-provision" || H,
  //                              plaintext = serialize(PairingProvisionPayload))
  bytes encrypted_payload = 1;
}

// Inner plaintext structure encrypted inside PairingConfirmServer.encrypted_complete.
message PairingCompletePayload {
  // Ed25519 signature by Ed_S over ("tapauth-pair-server-sig-v2" || H || csk),
  // proving both possession of Ed_S and receipt of the exact CSK.
  bytes server_signature = 1;
}

// Step 4 (Server/Phone -> Client/Desktop): Sent after the user confirms the 6-digit SAS on the Phone
// and the Phone decrypts PairingConfirmClient.
message PairingConfirmServer {
  // 12-byte random nonce || AEAD(key = K_s2c, nonce, aad = "tapauth-pair-v2-complete" || H,
  //                              plaintext = serialize(PairingCompletePayload))
  bytes encrypted_complete = 1;
}

enum PairingAbortReason {
  PAIRING_ABORT_REASON_UNSPECIFIED = 0;
  USER_REJECTED_SAS = 1;
  KEY_MISMATCH = 2;
  UNSUPPORTED_ALGORITHM = 3;
  PROTOCOL_ERROR = 4;
  SESSION_EXPIRED = 5;
}

// Explicit abort sent by either peer (e.g., user rejected SAS or key mismatch).
message PairingAbort {
  PairingAbortReason reason = 1;
  // When K_c2s / K_s2c has been derived, HMAC-SHA256(K_dir, "tapauth-pair-v2-abort" || H || be32(reason))
  // authenticates the abort so an unauthenticated LAN/BLE observer cannot spoof a cancellation.
  bytes auth_tag = 2;
}

// Sent periodically (every 1000ms) by the Phone over UDP while waiting for user SAS confirmation
// on the Desktop so NAT/SLIRP mappings stay open and the Desktop refreshes peer_addr.
message PairingKeepalive {}
