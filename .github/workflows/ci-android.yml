name: CI - Android

on:
  push:
    branches: [main]
    paths:
      - 'server-android/**'
      - 'shared/**'
      - 'tapauthd/**'
      - 'client-pam/**'
      - 'scripts/**'
      - 'proto/**'
      - 'Cargo.lock'
      - 'systemd/**'
      - 'packaging/**'
      - 'create-dev-users.sh'
      - '.github/workflows/ci-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server-android/**'
      - 'shared/**'
      - 'tapauthd/**'
      - 'client-pam/**'
      - 'scripts/**'
      - 'proto/**'
      - 'Cargo.lock'
      - 'systemd/**'
      - 'packaging/**'
      - 'create-dev-users.sh'
      - '.github/workflows/ci-android.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── 1. Android Mobile Build & APK Generation ─────────────────────────────────
  build-android:
    name: Build Android Native Libraries and APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Virtual Bluetooth Kernel Module (hci_vhci fail-fast)
        run: ./scripts/ci/build-kernel-vhci.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;30.0.14904198"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.14904198" >> "$GITHUB_ENV"

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Grant execute permission for gradlew
        run: chmod +x server-android/gradlew

      - name: Build native libraries (fail-fast)
        run: cd server-android && ./gradlew cargoBuild

      - name: Run Android JVM unit tests
        run: cd server-android && ./gradlew test --stacktrace

      - name: Build Android Debug APK, E2E APK, and Test APK
        run: cd server-android && ./gradlew assembleDebug assembleE2e assembleE2eAndroidTest --stacktrace

      - name: Check Kotlin formatting with Spotless
        run: cd server-android && ./gradlew spotlessCheck

      - name: Upload E2E APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: |
            server-android/app/build/outputs/apk/e2e/*.apk
            server-android/app/build/outputs/apk/androidTest/e2e/*.apk
          retention-days: 1

      - name: Upload debug APK artifact (safe for manual testing)
        uses: actions/upload-artifact@v7
        with:
          name: tapauth-debug-apk
          path: server-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload native libraries artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-libraries
          path: server-android/app/build/rustJniLibs/android/
          if-no-files-found: error
          retention-days: 30

  # ── 2. Ubuntu Debian Package Build (Parallel) ────────────────────────────────
  build-pkg-ubuntu:
    name: Build Ubuntu Debian Package (.deb)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "deb-pkg-v1"

      - name: Install Debian Packaging Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper-compat protobuf-compiler libdbus-1-dev libsystemd-dev libpam0g-dev clang libclang-dev pkg-config dpkg-dev polkitd dbus

      - name: Build TapAuth Debian Packages (Production)
        run: |
          ./scripts/ci/build-debian-packages.sh

      - name: Verify Debian Package Quality & Invariants
        run: |
          sudo ./scripts/ci/test-ubuntu-deb.sh --skip-build

      - name: Scan Shipped Debian Binaries for Dev Overrides
        run: |
          ./scripts/ci/scan-package-artifacts.sh deb /tmp/deb-build

      - name: Upload Production Debian Packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-ubuntu
          path: /tmp/deb-build/*.deb
          retention-days: 1

      - name: Build TapAuth Debian Packages (Test/E2E)
        run: |
          ./scripts/ci/build-debian-packages.sh --allow-test-features --features "tapauthd/dev-udp-loopback,tapauthd/dev-polkit-bypass" --output-dir /tmp/deb-test-build

      - name: Upload Test Debian Packages (E2E)
        uses: actions/upload-artifact@v7
        with:
          name: pkg-ubuntu-test
          path: /tmp/deb-test-build/*.deb
          retention-days: 1

  # ── 3. Fedora RPM Package Build (Parallel, with --nocheck & cache) ────────────
  build-pkg-fedora:
    name: Build Fedora RPM Package (.rpm)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Cargo, sccache, and DNF
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/sccache
            ~/.cache/dnf
          key: ${{ runner.os }}-fedora-sccache-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fedora-sccache-v1-
            ${{ runner.os }}-fedora-sccache-

      - name: Build TapAuth Fedora RPM Packages (Production)
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git ~/.cache/sccache ~/.cache/dnf
          docker run --rm \
            -v "$PWD":/workspace \
            -v ~/.cargo/registry:/root/.cargo/registry \
            -v ~/.cargo/git:/root/.cargo/git \
            -v ~/.cache/sccache:/root/.cache/sccache \
            -v ~/.cache/dnf:/var/cache/dnf \
            -e RUSTC_WRAPPER=sccache \
            -e SCCACHE_DIR=/root/.cache/sccache \
            fedora:latest \
            bash -c "cd /workspace && ./scripts/ci/build-fedora-packages.sh --nocheck --output-dir /workspace/pkg-fedora"
          sudo chown -R $(id -u):$(id -g) ~/.cargo ~/.cache

      - name: Verify Fedora RPM Package Quality & Invariants
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            fedora:latest \
            bash -c "cd /workspace && ./scripts/ci/test-fedora-rpm.sh --skip-build /workspace/pkg-fedora"

      - name: Scan Shipped Fedora RPM Binaries for Dev Overrides
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            fedora:latest \
            bash -c "dnf install -y binutils cpio rpm-build >/dev/null 2>&1 && cd /workspace && ./scripts/ci/scan-package-artifacts.sh rpm /workspace/pkg-fedora"

      - name: Upload Production Fedora RPM Packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-fedora
          path: pkg-fedora/*.rpm
          retention-days: 1

      - name: Build TapAuth Fedora RPM Packages (Test/E2E)
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git ~/.cache/sccache ~/.cache/dnf
          docker run --rm \
            -v "$PWD":/workspace \
            -v ~/.cargo/registry:/root/.cargo/registry \
            -v ~/.cargo/git:/root/.cargo/git \
            -v ~/.cache/sccache:/root/.cache/sccache \
            -v ~/.cache/dnf:/var/cache/dnf \
            -e RUSTC_WRAPPER=sccache \
            -e SCCACHE_DIR=/root/.cache/sccache \
            fedora:latest \
            bash -c "cd /workspace && ./scripts/ci/build-fedora-packages.sh --nocheck --output-dir /workspace/pkg-fedora-test --allow-test-features --features 'tapauthd/dev-udp-loopback,tapauthd/dev-polkit-bypass,tapauthd/fallback-socket'"
          sudo chown -R $(id -u):$(id -g) ~/.cargo ~/.cache

      - name: Upload Test Fedora RPM Packages (E2E)
        uses: actions/upload-artifact@v7
        with:
          name: pkg-fedora-test
          path: pkg-fedora-test/*.rpm
          retention-days: 1

  # ── 4. Arch Linux Package Build (Parallel) ───────────────────────────────────
  build-pkg-arch:
    name: Build Arch Linux Package (.pkg.tar.zst)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Cargo, sccache, and Pacman
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cargo-arch
            ~/.cache/sccache
            ~/.cache/pacman/pkg
          key: ${{ runner.os }}-arch-sccache-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arch-sccache-v1-
            ${{ runner.os }}-arch-sccache-

      - name: Build TapAuth Arch Linux Packages (Production)
        run: |
          mkdir -p ~/.cache/cargo-arch ~/.cache/sccache ~/.cache/pacman/pkg
          docker run --rm \
            -v "$PWD":/workspace \
            -v ~/.cache/cargo-arch:/cache/cargo \
            -v ~/.cache/sccache:/cache/sccache \
            -v ~/.cache/pacman/pkg:/var/cache/pacman/pkg \
            -e RUSTC_WRAPPER=sccache \
            -e SCCACHE_DIR=/cache/sccache \
            archlinux:base-devel \
            bash -c "cd /workspace && ./scripts/ci/build-arch-packages.sh --output-dir /workspace/pkg-arch"
          sudo chown -R $(id -u):$(id -g) ~/.cache

      - name: Verify Arch Package Quality & Invariants
        run: |
          docker run --rm --privileged \
            -v "$PWD":/workspace \
            archlinux:base-devel \
            bash -c "cd /workspace && ./scripts/ci/test-arch-pkg.sh --skip-build /workspace/pkg-arch"

      - name: Scan Shipped Arch Binaries for Dev Overrides
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            archlinux:base-devel \
            bash -c "cd /workspace && ./scripts/ci/scan-package-artifacts.sh arch /workspace/pkg-arch"

      - name: Upload Production Arch Linux Packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-arch
          path: pkg-arch/*.pkg.tar.zst
          retention-days: 1

      - name: Build TapAuth Arch Linux Packages (Test/E2E)
        run: |
          mkdir -p ~/.cache/cargo-arch ~/.cache/sccache ~/.cache/pacman/pkg
          docker run --rm \
            -v "$PWD":/workspace \
            -v ~/.cache/cargo-arch:/cache/cargo \
            -v ~/.cache/sccache:/cache/sccache \
            -v ~/.cache/pacman/pkg:/var/cache/pacman/pkg \
            -e RUSTC_WRAPPER=sccache \
            -e SCCACHE_DIR=/cache/sccache \
            archlinux:base-devel \
            bash -c "cd /workspace && ./scripts/ci/build-arch-packages.sh --output-dir /workspace/pkg-arch-test --allow-test-features --features 'tapauthd/dev-udp-loopback,tapauthd/dev-polkit-bypass,tapauthd/fallback-socket'"
          sudo chown -R $(id -u):$(id -g) ~/.cache

      - name: Upload Test Arch Linux Packages (E2E)
        uses: actions/upload-artifact@v7
        with:
          name: pkg-arch-test
          path: pkg-arch-test/*.pkg.tar.zst
          retention-days: 1

  # ── 5. Real-Android Emulator E2E Test (Single Session, All Distros) ──────────
  e2e:
    name: Real-Android E2E Tests (Ubuntu, Fedora, Arch)
    needs: [build-android, build-pkg-ubuntu, build-pkg-fedora, build-pkg-arch]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Virtual Bluetooth Kernel Module (hci_vhci fail-fast)
        run: ./scripts/ci/build-kernel-vhci.sh

      - name: Download Android APKs
        uses: actions/download-artifact@v7
        with:
          name: android-apks
          path: apks

      - name: Place APKs in Expected Paths
        run: |
          mkdir -p server-android/app/build/outputs/apk/e2e server-android/app/build/outputs/apk/androidTest/e2e
          find apks -type f -name "*e2e*.apk" -not -name "*androidTest*" -exec cp {} server-android/app/build/outputs/apk/e2e/app-e2e.apk \;
          find apks -type f -name "*androidTest*.apk" -exec cp {} server-android/app/build/outputs/apk/androidTest/e2e/app-e2e-androidTest.apk \;
          ls -la server-android/app/build/outputs/apk/e2e/ server-android/app/build/outputs/apk/androidTest/e2e/

      - name: Download Distro Packages
        uses: actions/download-artifact@v7
        with:
          path: packages

      - name: Arrange Distro Packages
        run: |
          mkdir -p pkg-fedora pkg-arch /tmp/deb-build
          if find packages -type f -name "*.deb" | grep -q "pkg-ubuntu-test"; then
            find packages -type f -path "*pkg-ubuntu-test*/*.deb" -exec cp {} /tmp/deb-build/ \;
          else
            find packages -type f -name "*.deb" -exec cp {} /tmp/deb-build/ \;
          fi

          if find packages -type f -name "*.rpm" | grep -q "pkg-fedora-test"; then
            find packages -type f -path "*pkg-fedora-test*/*.rpm" -exec cp {} pkg-fedora/ \;
          else
            find packages -type f -name "*.rpm" -exec cp {} pkg-fedora/ \;
          fi

          if find packages -type f -name "*.pkg.tar.zst" | grep -q "pkg-arch-test"; then
            find packages -type f -path "*pkg-arch-test*/*.pkg.tar.zst" -exec cp {} pkg-arch/ \;
          else
            find packages -type f -name "*.pkg.tar.zst" -exec cp {} pkg-arch/ \;
          fi
          ls -la /tmp/deb-build/ pkg-fedora/ pkg-arch/

      - name: Install Host E2E Dependencies & Bumble
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bluez bluez-tools dbus \
            libpam0g-dev pamtester \
            libdbus-1-dev pkg-config \
            policykit-1 qrencode
          python3 -m pip install --user --break-system-packages "bumble[android-netsim]" grpcio protobuf \
            || python3 -m pip install "bumble[android-netsim]" grpcio protobuf

      - name: Install Host Ubuntu Debian Package
        run: |
          sudo apt-get install -y /tmp/deb-build/tapauth_*.deb /tmp/deb-build/tapauth-fprintd_*.deb
          dpkg -l tapauth tapauth-fprintd
          id tapauthd
          getent group tapauthd-clients
          systemctl is-enabled tapauthd.socket
          ls -la /lib/x86_64-linux-gnu/security/pam_tapauth.so /usr/bin/tapauthd /usr/bin/tapauth-ipc-cli

      - name: Free disk space & Pre-pull Distro Images for Fast E2E
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo docker image prune -f || true
          docker pull fedora:latest &
          docker pull archlinux:base-devel &
          wait
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK (platform-tools / adb)
        uses: android-actions/setup-android@v4

      - name: Enable KVM (for Android Emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run JNI & Full Real-Android E2E Tests (Single Emulator Session)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/ci/run-all-e2e.sh

      - name: Verify Package Removal and Purge
        if: always()
        run: |
          sudo apt-get purge -y tapauth-fprintd tapauth 2>/dev/null || true
          sudo rm -rf pkg-fedora pkg-fedora-test pkg-arch pkg-arch-test /tmp/deb-build /tmp/deb-test-build apks packages
          test ! -d /etc/tapauth || [ -z "$(ls -A /etc/tapauth 2>/dev/null)" ]
