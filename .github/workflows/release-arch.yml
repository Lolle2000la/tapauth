name: "Release: Arch AUR"

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-arch-aur:
    name: Arch User Repository (AUR) Sync
    runs-on: ubuntu-latest
    environment: release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}
    steps:
      - name: Checkout Source Context
        uses: actions/checkout@v7

      - name: Extract Dynamic Version Context
        id: version_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0] | {tag_name, prerelease}')
            TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          CLEAN_VER="${TAG_NAME#v}"
          echo "VERSION=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Remote Release Tarball Checksum
        id: calc_sha
        run: |
          TARBALL_URL="https://github.com/lolle2000la/tapauth/archive/refs/tags/v${{ steps.version_vars.outputs.VERSION }}.tar.gz"
          curl -sL "$TARBALL_URL" -o release.tar.gz
          SHA256_HASH=$(sha256sum release.tar.gz | cut -d' ' -f1)
          echo "SHA256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"
          echo "Release archive verified hash: ${SHA256_HASH}"

      - name: Synchronize and Push Metadata Changes to the AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_aur
          chmod 600 ~/.ssh/id_aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_aur

          git config --global user.name "AUR Deployment Pipeline"
          git config --global user.email "lolle2000.la+tapauth@gmail.com"

          git clone aur@aur.archlinux.org:tapauth.git aur-repo
          cd aur-repo

          # PKGBUILD and install scriptlet are checked in under packaging/arch/
          # and shared verbatim with the CI package builders. Only the version
          # and the release-tarball checksum are substituted here.
          cp ../packaging/arch/PKGBUILD .
          cp ../packaging/arch/tapauth.install .
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version_vars.outputs.VERSION }}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.calc_sha.outputs.SHA256 }}')/" PKGBUILD

          # Generate .SRCINFO from the PKGBUILD with makepkg, so the AUR metadata
          # can never drift from the shared PKGBUILD. makepkg refuses to run as
          # root and needs a writable build dir, so run it as a throwaway user in
          # an Arch container and capture stdout.
          SRCINFO="$(docker run --rm \
            -v "$PWD/PKGBUILD:/src/PKGBUILD:ro" \
            -v "$PWD/tapauth.install:/src/tapauth.install:ro" \
            archlinux:base-devel bash -c '
              useradd -m builder 2>/dev/null
              mkdir -p /work && cp /src/PKGBUILD /src/tapauth.install /work/
              chown -R builder /work
              su builder -c "cd /work && makepkg --printsrcinfo"
            ')"
          printf "%s\n" "$SRCINFO" > .SRCINFO

          git add PKGBUILD .SRCINFO tapauth.install
          git commit -m "Automated production sync target version: v${{ steps.version_vars.outputs.VERSION }}"
          git push origin master
