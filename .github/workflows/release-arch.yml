name: "Release: Arch AUR"

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-arch-aur:
    name: Arch User Repository (AUR) Sync
    runs-on: ubuntu-latest
    environment: release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}
    steps:
      - name: Checkout Source Context
        uses: actions/checkout@v7

      - name: Extract Dynamic Version Context
        id: version_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0] | {tag_name, prerelease}')
            TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          CLEAN_VER="${TAG_NAME#v}"
          echo "VERSION=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Remote Release Tarball Checksum
        id: calc_sha
        run: |
          TARBALL_URL="https://github.com/lolle2000la/tapauth/archive/refs/tags/v${{ steps.version_vars.outputs.VERSION }}.tar.gz"
          curl -sL "$TARBALL_URL" -o release.tar.gz
          SHA256_HASH=$(sha256sum release.tar.gz | cut -d' ' -f1)
          echo "SHA256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"
          echo "Release archive verified hash: ${SHA256_HASH}"

      - name: Synchronize and Push Metadata Changes to the AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_aur
          chmod 600 ~/.ssh/id_aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_aur

          git config --global user.name "AUR Deployment Pipeline"
          git config --global user.email "lolle2000.la+tapauth@gmail.com"

          git clone aur@aur.archlinux.org:tapauth.git aur-repo
          
          # Copy source packaging files
          cp packaging/arch/tapauth.install aur-repo/tapauth.install
          cp packaging/arch/tapauth-fprintd.install aur-repo/tapauth-fprintd.install
          cp packaging/arch/PKGBUILD aur-repo/PKGBUILD

          cd aur-repo
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version_vars.outputs.VERSION }}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.calc_sha.outputs.SHA256 }}')/" PKGBUILD

          # Generate .SRCINFO
          cat > .SRCINFO << 'EOF'
          pkgbase = tapauth
          	pkgdesc = Local smartphone-based authentication framework engine
          	pkgver = ${{ steps.version_vars.outputs.VERSION }}
          	pkgrel = 1
          	url = https://github.com/lolle2000la/tapauth
          	arch = x86_64
          	arch = aarch64
          	license = AGPL-3.0-only
          	makedepends = cargo
          	makedepends = rust
          	makedepends = protobuf
          	makedepends = clang
          	makedepends = pam
          	source = tapauth-${{ steps.version_vars.outputs.VERSION }}.tar.gz::https://github.com/lolle2000la/tapauth/archive/refs/tags/v${{ steps.version_vars.outputs.VERSION }}.tar.gz
          	sha256sums = ${{ steps.calc_sha.outputs.SHA256 }}

          pkgname = tapauth
          	pkgdesc = Local smartphone-based authentication framework engine
          	install = tapauth.install
          	depends = dbus
          	depends = pam
          	optdepends = polkit: for polkit agent authentication helper
          	optdepends = firewalld: for automated firewall port management
          	optdepends = iptables: for iptables firewall integration
          	optdepends = bluez: for Bluetooth Low Energy (BLE) transport
          	optdepends = tapauth-fprintd: for virtual fprintd desktop lock screen integration
          	provides = tapauth
          	conflicts = tapauth-git

          pkgname = tapauth-fprintd
          	pkgdesc = Virtual fprintd D-Bus bridge for TapAuth lock screen integration
          	install = tapauth-fprintd.install
          	depends = tapauth
          	depends = dbus
          	provides = fprintd
          	provides = tapauth-fprintd
          	conflicts = fprintd
          	conflicts = tapauth-fprintd-git
          EOF

          if git diff --quiet PKGBUILD .SRCINFO tapauth.install tapauth-fprintd.install; then
            echo "No changes in packaging files. Skipping commit."
            exit 0
          fi

          git add PKGBUILD .SRCINFO tapauth.install tapauth-fprintd.install
          git commit -m "Automated production sync target version: v${{ steps.version_vars.outputs.VERSION }}"
          git push origin master
