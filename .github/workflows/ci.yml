name: CI - Rust & Packages

on:
  # `push` keeps its `paths:` filter. The merge group and the pull request have
  # already validated the change, so a third, unfiltered post-merge run is pure
  # cost; the filtered push run stays a safety net for direct/bypass pushes.
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'tapauthd/**'
      - 'client-pam/**'
      - 'client-config-gui/**'
      - 'proto/**'
      - 'packaging/**'
      - 'systemd/**'
      - 'scripts/**'
      - 'install.sh'
      - 'uninstall.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  # No `paths:` here: these jobs are required status checks, and a required
  # check cannot be path-filtered — GitHub leaves a check whose run was skipped
  # `Pending` forever, so the PR could be neither merged nor queued.
  pull_request:
    branches: [main]
  # No `paths:` here either: GitHub supports no path filters on merge_group.
  merge_group:
    types: [checks_requested]
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-format:
    name: Code Quality & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Every context the merge-queue ruleset requires must still match a job
      # `name:` here or in ci-android.yml. A rename is otherwise silent: nothing
      # reports the old name, so queued entries wait out the response timeout.
      - name: Check required checks match job names
        run: ./scripts/ci/check-required-checks.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libpam0g-dev \
            protobuf-compiler \
            libgtk-4-dev \
            build-essential

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: "Run clippy (dev sandbox, fallback-socket)"
        run: cargo clippy -p tapauthd --features fallback-socket --all-targets -- -D warnings

      - name: "Run clippy (E2E build, UDP loopback + PolKit bypass)"
        run: cargo clippy -p tapauthd --no-default-features --features ble,dev-udp-loopback,dev-polkit-bypass --all-targets -- -D warnings

      - name: "Run clippy (state-dir override only)"
        run: cargo clippy -p tapauthd --no-default-features --features dev-state-override --all-targets -- -D warnings

      # `tpm` is a pure cfg gate (`shared/Cargo.toml`: `tpm = []`), so compiling it
      # needs no TPM device and no `tpm2-tools` (that is a runtime shell-out only).
      # Nothing else in CI enabled the feature — only `install.sh --tpm` builds it —
      # so a regression inside it would have shipped unseen. `--features` is
      # ambiguous on a virtual workspace, hence the explicit package list.
      - name: "Run clippy (TPM feature)"
        run: cargo clippy -p shared -p tapauthd -p client-pam -p client-config-gui --all-targets --features tpm -- -D warnings

  production-guard:
    name: Production Build Override Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libpam0g-dev \
            protobuf-compiler \
            libgtk-4-dev \
            build-essential

      # Builds the shipped artifacts per crate (debug + release), scans them for
      # dev overrides and self-checks the scan with a positive control. This is
      # release-build heavy, so it runs as its own job instead of delaying
      # formatting/clippy feedback in `lint-and-format`.
      - name: Verify production binaries contain no dev/test overrides
        run: ./scripts/ci/check-production-build.sh

  build-and-test:
    name: Build and Test Workspace Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Kotlin's `external fun` declarations in TapAuthCrypto.kt and the `Java_*`
      # exports in shared/src/jni_api.rs must name the same functions; a one-sided
      # entry compiles and then throws UnsatisfiedLinkError on the device. Both
      # sides are parsed from source text, so this needs no toolchain: running it
      # first turns that divergence into a failure in seconds instead of after the
      # cargo builds below.
      - name: Check JNI surface matches between Kotlin and Rust
        run: ./scripts/ci/check-jni-surface.sh

      # The C ABI these two sides share carries no types: a `jlong` implemented
      # as `jint`, or two same-typed parameters swapped in Rust, still compiles,
      # still links, and still passes the name check above — it is undefined
      # behaviour on the device. This compares each Rust parameter list and
      # return type against the Kotlin declaration's JVM descriptor, which is in
      # turn pinned to real `javap` output by a checked-in fixture because this
      # job has no Android toolchain and cannot compile Kotlin.
      - name: Check JNI signatures match between Kotlin and Rust
        run: ./scripts/ci/check-jni-signatures.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libpam0g-dev \
            protobuf-compiler \
            libgtk-4-dev \
            build-essential

      - name: Build shared library (default features)
        run: cargo build --manifest-path shared/Cargo.toml --verbose

      - name: Build shared library (with jni feature)
        run: cargo build --manifest-path shared/Cargo.toml --features jni --verbose

      - name: "Build tapauthd (default: BLE + firewall)"
        run: cargo build --manifest-path tapauthd/Cargo.toml --verbose

      - name: "Build tapauthd (no BLE, firewall only)"
        run: cargo build --manifest-path tapauthd/Cargo.toml --no-default-features --features firewall --verbose

      - name: "Build client PAM module"
        run: cargo build --manifest-path client-pam/Cargo.toml --verbose

      - name: "Build client PAM module (no features)"
        run: cargo build --manifest-path client-pam/Cargo.toml --no-default-features --verbose

      - name: Build client config GUI
        run: cargo build --manifest-path client-config-gui/Cargo.toml --verbose

      - name: Build all workspace members
        run: cargo build --workspace --verbose

      - name: Run tests for shared library
        run: cargo test --manifest-path shared/Cargo.toml --verbose

      - name: Run tests for shared library (with jni feature)
        run: cargo test --manifest-path shared/Cargo.toml --features jni --verbose

      - name: Run tests for client PAM module
        run: cargo test --manifest-path client-pam/Cargo.toml --verbose

      - name: Install PAM host-case test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpam0g-dev \
            python3

      # Host-facing PAM verdicts: TTY-less wait announcement, DM bypass,
      # sufficient-stack fallthrough, double invocation. Needs root (writes
      # /etc/pam.d and the production socket path; both are restored on exit).
      # The module is rebuilt unprivileged here so the sudo'd script always has
      # target/debug/libclient_pam.so and never runs cargo as root; the script
      # compiles its own pamtester from scripts/ci/pamtester.c, so no distro
      # pamtester package is needed.
      - name: Run PAM host-case tests (root)
        run: |
          cargo build --manifest-path client-pam/Cargo.toml --verbose
          sudo env \
            CI="$CI" \
            PAM_MODULE_PATH="$PWD/target/debug/libclient_pam.so" \
            SKIP_BUILD=1 \
            ./scripts/ci/test-pam-host-cases.sh

      # Threaded PAM conversation path: the allowlist keyed on the calling
      # process, the sufficient/required/bypass stack shapes and the
      # non-allowlisted control. Runs unprivileged — it builds the module itself
      # (release, --features dev-socket-override), compiles its C harness against
      # the libpam0g-dev headers installed above, and uses pam_start_confdir so
      # it never writes /etc/pam.d. No sudo.
      - name: Run PAM conversation-thread harness
        run: ./scripts/ci/test-pam-conv-thread.sh

      - name: Run tests for client config GUI
        run: cargo test --manifest-path client-config-gui/Cargo.toml --verbose

      - name: Run all workspace tests
        run: cargo test --workspace --verbose

  musl-check:
    name: Musl Target Build Check (client-pam)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libpam0g-dev \
            protobuf-compiler \
            build-essential

      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Check shared and client PAM module for the musl target
        run: |
          cargo check -p shared --target x86_64-unknown-linux-musl
          cargo check -p client-pam --target x86_64-unknown-linux-musl
