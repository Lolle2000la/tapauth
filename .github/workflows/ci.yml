name: CI - Rust & Packages

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'tapauthd/**'
      - 'client-pam/**'
      - 'client-config-gui/**'
      - 'proto/**'
      - 'packaging/**'
      - 'systemd/**'
      - 'scripts/**'
      - 'install.sh'
      - 'uninstall.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'tapauthd/**'
      - 'client-pam/**'
      - 'client-config-gui/**'
      - 'proto/**'
      - 'packaging/**'
      - 'systemd/**'
      - 'scripts/**'
      - 'install.sh'
      - 'uninstall.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-format:
    name: Code Quality & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libpam0g-dev \
            protobuf-compiler \
            libgtk-4-dev \
            build-essential

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: "Run clippy (dev sandbox, fallback-socket)"
        run: cargo clippy -p tapauthd --features fallback-socket --all-targets -- -D warnings

      - name: "Run clippy (E2E build, UDP loopback + PolKit bypass)"
        run: cargo clippy -p tapauthd --no-default-features --features ble,dev-udp-loopback,dev-polkit-bypass --all-targets -- -D warnings

      - name: "Run clippy (state-dir override only)"
        run: cargo clippy -p tapauthd --no-default-features --features dev-state-override --all-targets -- -D warnings

  production-guard:
    name: Production Build Override Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libpam0g-dev \
            protobuf-compiler \
            libgtk-4-dev \
            build-essential

      # Builds the shipped artifacts per crate (debug + release), scans them for
      # dev overrides and self-checks the scan with a positive control. This is
      # release-build heavy, so it runs as its own job instead of delaying
      # formatting/clippy feedback in `lint-and-format`.
      - name: Verify production binaries contain no dev/test overrides
        run: ./scripts/ci/check-production-build.sh

  build-and-test:
    name: Build and Test Workspace Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libpam0g-dev \
            protobuf-compiler \
            libgtk-4-dev \
            build-essential

      - name: Build shared library (default features)
        run: cargo build --manifest-path shared/Cargo.toml --verbose

      - name: Build shared library (with jni feature)
        run: cargo build --manifest-path shared/Cargo.toml --features jni --verbose

      - name: "Build tapauthd (default: BLE + firewall)"
        run: cargo build --manifest-path tapauthd/Cargo.toml --verbose

      - name: "Build tapauthd (no BLE, firewall only)"
        run: cargo build --manifest-path tapauthd/Cargo.toml --no-default-features --features firewall --verbose

      - name: "Build client PAM module"
        run: cargo build --manifest-path client-pam/Cargo.toml --verbose

      - name: "Build client PAM module (no features)"
        run: cargo build --manifest-path client-pam/Cargo.toml --no-default-features --verbose

      - name: Build client config GUI
        run: cargo build --manifest-path client-config-gui/Cargo.toml --verbose

      - name: Build all workspace members
        run: cargo build --workspace --verbose

      - name: Run tests for shared library
        run: cargo test --manifest-path shared/Cargo.toml --verbose

      - name: Run tests for shared library (with jni feature)
        run: cargo test --manifest-path shared/Cargo.toml --features jni --verbose

      - name: Run tests for client PAM module
        run: cargo test --manifest-path client-pam/Cargo.toml --verbose

      - name: Install PAM host-case test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpam0g-dev \
            python3

      # Host-facing PAM verdicts: TTY-less wait announcement, DM bypass,
      # sufficient-stack fallthrough, double invocation. Needs root (writes
      # /etc/pam.d and the production socket path; both are restored on exit).
      # The module is rebuilt unprivileged here so the sudo'd script always has
      # target/debug/libclient_pam.so and never runs cargo as root; the script
      # compiles its own pamtester from scripts/ci/pamtester.c, so no distro
      # pamtester package is needed.
      - name: Run PAM host-case tests (root)
        run: |
          cargo build --manifest-path client-pam/Cargo.toml --verbose
          sudo env \
            CI="$CI" \
            PAM_MODULE_PATH="$PWD/target/debug/libclient_pam.so" \
            SKIP_BUILD=1 \
            ./scripts/ci/test-pam-host-cases.sh

      # Threaded PAM conversation path: the allowlist keyed on the calling
      # process, the sufficient/required/bypass stack shapes and the
      # non-allowlisted control. Runs unprivileged — it builds the module itself
      # (release, --features dev-socket-override), compiles its C harness against
      # the libpam0g-dev headers installed above, and uses pam_start_confdir so
      # it never writes /etc/pam.d. No sudo.
      - name: Run PAM conversation-thread harness
        run: ./scripts/ci/test-pam-conv-thread.sh

      - name: Run tests for client config GUI
        run: cargo test --manifest-path client-config-gui/Cargo.toml --verbose

      - name: Run all workspace tests
        run: cargo test --workspace --verbose

  musl-check:
    name: Musl Target Build Check (client-pam)
    runs-on: ubuntu-latest

    # Cheap cross-target interface check, deliberately its own job so it never
    # delays the main build-and-test feedback. `cargo check` only runs the
    # front-end (no linking), so a musl C toolchain is not needed: what this
    # catches is a dependency that is unavailable or unbuildable for
    # x86_64-unknown-linux-musl. It does NOT prove the cdylib links under musl.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libpam0g-dev \
            protobuf-compiler \
            build-essential

      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl

      # `shared` is checked first: client-pam depends on it, and its build.rs
      # generates the protobuf modules for this target too.
      - name: Check shared and client PAM module for the musl target
        run: |
          cargo check -p shared --target x86_64-unknown-linux-musl
          cargo check -p client-pam --target x86_64-unknown-linux-musl
