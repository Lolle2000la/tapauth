# Type Path                      Mode User     Group            Age Argument
#
# /etc/tapauth stays root-owned so the daemon cannot add or remove arbitrary
# files there, but the runtime config is created owned by the daemon: it is the
# single writer (SaveConfig persists hostname/port/transport toggles), and a
# root:root config file would make the first SaveConfig on a fresh package
# install fail with EACCES. install.sh establishes the same posture.
d      /etc/tapauth              0755 root     root             -   -
f      /etc/tapauth/config.toml  0644 tapauthd tapauthd         -   -
d      /var/lib/tapauth          0700 tapauthd tapauthd         -   -
d      /var/log/tapauth          0755 tapauthd tapauthd         -   -
d      /run/tapauthd             0750 tapauthd tapauthd-clients -   -
