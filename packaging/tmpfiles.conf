# Type Path                  Mode User     Group            Age Argument
# NOTE: /run/tapauthd is created by tapauthd.socket (RuntimeDirectory=) and
# /var/log/tapauth by tapauthd.service (LogsDirectory=) — do not duplicate
# them here.
d      /var/lib/tapauth      0700 tapauthd tapauthd         -   -
d      /etc/tapauth          0755 tapauthd tapauthd         -   -
