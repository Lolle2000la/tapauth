<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="net.reactivated.Fprint"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Manager"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Device"/>
  </policy>

  <policy user="tapauthd">
    <allow own="net.reactivated.Fprint"/>
  </policy>

  <!-- Display manager greeter accounts (GDM runs as gdm/Debian-gdm, SDDM as sddm) -->
  <policy user="gdm">
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Manager"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Device"/>
  </policy>

  <policy user="Debian-gdm">
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Manager"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Device"/>
  </policy>

  <policy user="sddm">
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Manager"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Device"/>
  </policy>

  <policy user="lightdm">
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Manager"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Device"/>
  </policy>

  <!-- Allow any user to call the Manager and Device methods matching upstream fprintd.
       fprintd.rs enforces caller UID verification and authorization daemon-side. -->
  <policy context="default">
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Manager"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Device"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
