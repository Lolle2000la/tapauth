[package]
name = "tapauthd"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared", features = ["firewall"] }
prost = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-journald = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "io-util",
    "signal",
    "sync",
] }
getrandom = { workspace = true }
nix = { workspace = true, features = ["user", "socket"] }
socket2 = { workspace = true }
hex = { workspace = true }
zbus = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
local-ip-address = { workspace = true }
whoami = { workspace = true }

# BLE support
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }

[features]
default = ["ble", "firewall"]
ble = ["bluer"]
tpm = ["shared/tpm"]
firewall = ["shared/firewall"]
#
# Development / test-only knobs, all compiled out of production builds. The UDP
# shim, its receive-filter bypass and the PolKit bypass additionally require
# TAPAUTH_DEV_MODE at runtime, so a shipped binary can never be toggled by the
# environment alone; dev-state-override is keyed off TAPAUTH_STATE_DIR itself.
#
# dev-state-override: honour TAPAUTH_STATE_DIR (relocates the state dir and the
# config.toml inside it).
dev-state-override = ["shared/dev-state-override"]
# dev-udp-loopback: unicast every outgoing packet to TAPAUTH_DEV_UDP_TARGET and
# accept peer packets arriving from local addresses. Needed to talk to a peer
# that is emulated on the same host (e.g. the Android emulator over SLIRP).
dev-udp-loopback = ["shared/dev-udp-loopback"]
# dev-polkit-bypass: let same-UID and root admin callers through without a
# PolKit check, so test harnesses do not need an authentication agent.
dev-polkit-bypass = []
# fallback-socket: bind the IPC socket manually instead of relying on systemd
# socket activation (FD#3). Everything a local dev sandbox needs.
fallback-socket = [
    "dev-state-override",
    "dev-udp-loopback",
    "dev-polkit-bypass",
]
